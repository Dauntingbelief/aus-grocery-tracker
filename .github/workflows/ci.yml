name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # CDK's Python library runs on Node.js under the hood (jsii)
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install package, dev tools and CDK
        run: pip install -e ".[dev,infra]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest)
        run: pytest
